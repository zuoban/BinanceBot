services:
  binance-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: "ghcr.io/zuoban/binancebot:${BOT_VERSION:-0.12.0}"
    container_name: binance-grid-bot
    restart: unless-stopped
    stop_grace_period: 45s
    user: "${BOT_UID:-10001}:${BOT_GID:-10001}"
    command: ["--db", "/app/data/bot.db", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - ./data:/app/data
    environment:
      RUST_LOG: binance_grid_bot=info
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: "ghcr.io/zuoban/binancebot-frontend:${BOT_VERSION:-0.12.0}"
    restart: unless-stopped
    depends_on:
      binance-bot:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
