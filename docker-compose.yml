services:
  binance-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/zuoban/binancebot:latest
    container_name: binance-grid-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - RUST_LOG=binance_grid_bot=info,tower_http=info
