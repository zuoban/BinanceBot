# ===================================================================
# 币安合约网格交易机器人配置文件 (Binance Futures Grid Trading Bot)
# ===================================================================

[exchange]
# 交易币种 (Symbol)
symbol = "SOLUSDC"

# 币安 API Key (实盘交易时填写，模拟盘/Dry-Run 可留空)
api_key = ""

# 币安 API Secret (实盘交易时填写，模拟盘/Dry-Run 可留空)
api_secret = ""

# 是否使用币安合约测试网 (Testnet)
is_testnet = false

# 是否启用模拟盘模式 (Dry-Run / Paper Trading)
# true: 不向币安发送真实订单，订阅币安实时行情并在本地内存中进行撮合仿真和收益统计，零风险测试策略
# false: 使用 API Key 在币安合约执行真实挂单
dry_run = true

# 接收窗口时间 (毫秒)
recv_window = 5000

# 订单同步与对齐轮询间隔 (秒)
sync_interval_secs = 3

[grid]
# 固定档位间距 (USDC)，买卖共用相邻网格；须兼容交易所价格步长
# 买入 119.2 后买单向 119.1 移动；卖出 119.3 后可再次买入 119.2
grid_interval = 0.1

# 普通网格单目标金额 (USDC)，数量向下取整；成交后统一补窗口
# 实际名义金额受数量步长影响，可能略低于目标
order_amount_usdc = 100.0

# 买单目标数量：连续买入向下一格，受价格范围和仓位上限限制
buy_window = 5

# 卖单目标数量：连续卖出向上一格，受持仓和价格范围限制
sell_window = 5
# 窗口外和方向不符的未成交订单先撤单确认，再补齐窗口

# 挂单类型：只做 Maker 单 (Post-Only, timeInForce=GTX)，防止吃单，节省手续费
# 此策略必须保持 Maker 挂单
post_only = true

# 网格价格下限 (可选，例如 80.0)
# min_price = 80.0

# 网格价格上限 (可选，例如 200.0)
# max_price = 200.0

# 最大持仓名义价值上限 (USDC)，超出时停止同向挂单以控制风险
max_position_usdc = 2000.0

[server]
# Web 监控控制台监听地址 (0.0.0.0 允许局域网或公网通过服务器 IP 访问)
host = "0.0.0.0"

# Web 监控控制台端口 (浏览器访问 http://<服务器IP>:8080)
port = 8080

[telegram]
# 成交通知。也可在网页「策略参数在线配置」中填写并立即生效。
enabled = false
# 从 @BotFather 获取；启用时必填
bot_token = ""
# 个人聊天、群组或频道的 Chat ID；启用时必填
chat_id = ""
