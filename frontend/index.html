<!doctype html>
<html lang="zh-CN">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>Grid Console · 网格交易控制台</title>
    <script>
      let preference;
      try { preference = localStorage.getItem('binance_bot_theme'); } catch {}
      const dark = preference === 'dark' || (preference !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      const themeColor = document.querySelector('meta[name="theme-color"]');
      if (dark && themeColor) themeColor.content = themeColor.dataset.dark;
    </script>
    <style>
      body { margin: 0; background: var(--bg-page); }
      .boot-screen { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: var(--space-4); color: var(--text-secondary); font: var(--text-xs) var(--font-sans); }
      .boot-mark { display: block; width: var(--control-touch); height: var(--control-touch); border-radius: 10px; }
      .boot-screen p { margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-screen" role="status"><img class="boot-mark" src="/logo.svg" alt="" /><p>正在准备工作台…</p></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
